spring.application.name=user-service

# 数据库配置 MYSQL（与 content-service 共享库，user-service 只管理 users 表）
spring.datasource.url=jdbc:mysql://localhost:3306/codeflow?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 服务器配置
server.port=8081

# 文件上传配置
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# 日志配置
logging.level.com.example.codeflow=INFO

#JWT（三服务必须一致）
jwt.secret=mySuperSecretKeyThatIsLongEnough12345
jwt.expirationMs=86400000
