spring.application.name=agent-service

# 数据库配置 MYSQL（与 content-service 共享库，agent-service 只管理 chat 表）
spring.datasource.url=jdbc:mysql://localhost:3306/codeflow?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置（只建/维护 chat 相关表）
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 服务器配置
server.port=8083

# 日志配置
logging.level.com.example.codeflow=INFO

#JWT（三服务必须一致）
jwt.secret=mySuperSecretKeyThatIsLongEnough12345
jwt.expirationMs=86400000

# 服务间调用地址（网关内部直连各服务）
service.url.content=http://localhost:8082
service.url.user=http://localhost:8081

# Import local secrets (create secrets.properties in backend/agent-service/ with your keys)
spring.config.import=optional:classpath:secrets.properties

# DeepSeek AI API (key lives in secrets.properties — never commit it)
deepseek.api.base-url=https://api.deepseek.com
deepseek.api.model=deepseek-chat
