spring.application.name=CodeFlow

# 数据库配置 MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/codeflow?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 服务器配置 (content-service)
server.port=8082

# 文件上传配置
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# 静态资源配置
spring.mvc.static-path-pattern=/**
spring.resources.static-locations=classpath:/static/,file:../../uploads/

# 日志配置
logging.level.com.example.codeflow=INFO
logging.level.org.springframework.web.multipart=DEBUG

#JWT
jwt.secret=mySuperSecretKeyThatIsLongEnough12345
jwt.expirationMs=86400000

spring.data.redis.port=6379
spring.data.redis.host=localhost
spring.data.redis.password=
spring.data.redis.database=0

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.type=ERROR
logging.level.org.hibernate.engine.QueryParameters=ERROR
logging.level.org.hibernate.engine.query.HQLQueryPlan=ERROR

# Import local secrets (create secrets.properties in backend/CodeFlow/ with your keys)
spring.config.import=optional:classpath:secrets.properties

# DeepSeek AI API (key lives in secrets.properties — never commit it)
deepseek.api.base-url=https://api.deepseek.com
deepseek.api.model=deepseek-chat

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka 不可用时 send 最多阻塞3s
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.consumer.group-id=content-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.type=batch